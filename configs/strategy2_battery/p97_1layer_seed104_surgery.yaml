model:
  p: 97
  d_model: 128
  n_layers: 1
  n_heads: 4
  d_head: 32
  d_mlp: 512
  n_ctx: 3
  act_fn: relu
  normalization_type: null
data:
  frac_train: 0.3
optim:
  lr: 0.001
  weight_decay: 1.0
train:
  seed: 100
  batch_size: 64
  epochs: 10000
  eval_every: 100
  checkpoint_milestones:
  - 0.8
  - 0.9
  - 0.95
  - 0.99
logging:
  wandb_project: grokking-demo
  run_name: strategy2-p97-battery
surgery:
  checkpoint_paths:
  - results/strategy2/p97_1layer/seed_104/artifacts/strategy2_p97_1layer_seed104_epoch_002000.pt
  - results/strategy2/p97_1layer/seed_104/artifacts/strategy2_p97_1layer_seed104_testacc_05.pt
  - results/strategy2/p97_1layer/seed_104/artifacts/strategy2_p97_1layer_seed104_testacc_50.pt
  - results/strategy2/p97_1layer/seed_104/artifacts/strategy2_p97_1layer_seed104_testacc_80.pt
  - results/strategy2/p97_1layer/seed_104/artifacts/strategy2_p97_1layer_seed104_testacc_95.pt
  - results/strategy2/p97_1layer/seed_104/artifacts/strategy2_p97_1layer_seed104_testacc_99.pt
  probe_split: test
  probe_max_examples: 0
  top_k:
  - 1
  - 2
  - 3
  random_control_repeats: 3
  eval_batch_size: 2048
  ranking_metric: dla_abs_score
  min_baseline_train_acc: 0.0
  min_baseline_test_acc: 0.0
  causal_train_floor: 0.9
  causal_test_chance_multiplier: 2.0
  seed: 104
